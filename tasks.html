<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Board - TaskFlow</title>
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/index.html">TaskFlow</a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <div class="navbar-nav ms-auto">
          <a class="nav-link" href="/index.html">Home</a>
          <a class="nav-link" href="/login.html">Login</a>
          <a class="nav-link" href="/dashboard.html">Dashboard</a>
          <a class="nav-link" href="/projects.html">Projects</a>
          <a class="nav-link active" href="/tasks.html">Task Board</a>

          <button id="logoutButton" class="btn btn-outline-light ms-lg-3">
  Logout
</button>
        </div>
      </div>
    </div>
  </nav>

<main class="page-section">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 id="projectTitle" class="mb-0">Task Board</h1>
    </div>

    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h2 class="h5 mb-3">Add Task</h2>

        <form id="taskForm">
          <div class="mb-3">
            <label for="taskTitle" class="form-label">Task Title</label>
            <input
              type="text"
              id="taskTitle"
              class="form-control"
              required
            />
          </div>

          <div class="mb-3">
            <label for="taskDescription" class="form-label">Description</label>
            <textarea
              id="taskDescription"
              class="form-control"
              rows="3"
            ></textarea>
          </div>

          <button type="submit" class="btn btn-primary">
            Add Task
          </button>
        </form>
      </div>
    </div>

    <div id="tasksContainer" class="row g-4"></div>
  </div>
</main>

  <script type="module" src="/src/main.js"></script>
  <script type="module" src="/src/auth-guard.js"></script>
  <script type="module" src="/src/tasks.js"></script>
</body>
</html>
