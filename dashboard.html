<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - TaskFlow</title>
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/index.html">TaskFlow</a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <div class="navbar-nav ms-auto">
          <a class="nav-link" href="/index.html">Home</a>
          <a class="nav-link" href="/login.html">Login</a>
          <a class="nav-link active" href="/dashboard.html">Dashboard</a>
          <a class="nav-link" href="/projects.html">Projects</a>
          <a class="nav-link" href="/tasks.html">Task Board</a>
          <button id="logoutButton" class="btn btn-outline-light ms-lg-3">
  Logout
</button>
        </div>
      </div>
    </div>
  </nav>

  <main class="page-section">
    <div class="container">
      <h1 class="mb-4">Dashboard</h1>

      <div class="row g-4">
        <div class="col-md-4">
          <div class="card shadow-sm h-100">
            <div class="card-body">
              <h5 class="card-title">Projects</h5>
              <p id="projectsCount" class="display-6 mb-0">0</p>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card shadow-sm h-100">
            <div class="card-body">
              <h5 class="card-title">Active Tasks</h5>
              <p id="activeTasksCount" class="display-6 mb-0">0</p>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card shadow-sm h-100">
            <div class="card-body">
              <h5 class="card-title">Completed Tasks</h5>
              <p id="completedTasksCount" class="display-6 mb-0">0</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/src/main.js"></script>
  <script type="module" src="/src/auth-guard.js"></script>
  <script type="module" src="/src/dashboard.js"></script>
</body>
</html>
