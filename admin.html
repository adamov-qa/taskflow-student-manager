<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel - TaskFlow</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/src/style.css" />
  </head>

  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="/index.html">TaskFlow</a>

        <div class="navbar-nav ms-auto">
          <a class="nav-link" href="/dashboard.html">Dashboard</a>
          <a class="nav-link" href="/projects.html">Projects</a>
          <a class="nav-link" href="/tasks.html">Task Board</a>
          <a class="nav-link active" href="/admin.html">Admin</a>

          <button
            id="logoutButton"
            class="btn btn-outline-light ms-3"
          >
            Logout
          </button>
        </div>
      </div>
    </nav>

    <main class="page-section">
      <div class="container">
        <h1 class="mb-4">Admin Panel</h1>

        <div
          id="adminMessage"
          class="alert alert-danger d-none"
        ></div>

        <div class="card shadow-sm">
          <div class="card-body">
            <h4 class="card-title mb-4">Registered Users</h4>

            <div class="table-responsive">
              <table class="table table-striped align-middle">
                <thead>
                  <tr>
                    <th>Full Name</th>
                    <th>Role</th>
                    <th>Created At</th>
                  </tr>
                </thead>

                <tbody id="usersTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/auth-guard.js"></script>
    <script type="module" src="/src/admin.js"></script>
  </body>
</html>
